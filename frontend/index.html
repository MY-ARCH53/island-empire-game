    <!-- Popunder frekans sistemi: Adsterra'dan ÖNCE yüklenmeli -->
    <script>
      (function() {
        var INTERVAL = 5 * 60 * 1000;
        var blocking = false;
        var timer = null;
        var _orig = window.open;

        window.open = function(url, target, features) {
          var u = url ? String(url) : '';
          // Kendi domainimize izin ver
          if (!u || u.indexOf('islandsempire.com') !== -1 || u.indexOf('localhost') !== -1 || u.charAt(0) === '/') {
            return _orig.apply(window, arguments);
          }
          // Bloke dönemindeyse engelle
          if (blocking) return null;
          // İzin ver — popup açılıyor
          return _orig.apply(window, arguments);
        };

        function startBlock() {
          blocking = true;
          if (timer) clearTimeout(timer);
          timer = setTimeout(function() { blocking = false; }, INTERVAL);
        }

        // Popup açıldığında pencere odağı kaybolur ama sekme hâlâ görünür
        window.addEventListener('blur', function() {
          if (!document.hidden) startBlock();
        });
      })();
    </script>
