<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>3D İzometrik Savaş</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Exo+2:wght@400;600;700;900&display=swap');
  :root{--gold:#ffd700;--red:#e94560;--green:#4ade80;--blue:#60a5fa;--bg:#080c16;--panel:#0f1629;--border:#1c2844}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Exo 2',sans-serif;overflow:hidden;height:100vh;user-select:none;color:#e2e8f0}
  canvas{display:block}
  #topHUD{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:10}
  .hud-box{background:linear-gradient(135deg,rgba(15,22,41,.95),rgba(8,12,22,.95));border:2px solid var(--border);border-radius:10px;padding:6px 16px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px}
  .hud-timer{border-color:var(--red)} .hud-timer span{font-family:'Bungee',cursive;font-size:20px;color:#fff}
  .hud-percent{border-color:var(--gold)} .hud-percent span{font-family:'Bungee',cursive;font-size:18px;color:var(--gold)}
  .hud-stars{display:flex;gap:4px}
  .hud-star{width:32px;height:32px;transition:all .4s;filter:drop-shadow(0 0 2px rgba(255,215,0,.2))}
  .hud-star.earned{filter:drop-shadow(0 0 10px rgba(255,215,0,.8));animation:starBounce .5s ease}
  @keyframes starBounce{0%{transform:scale(.3) rotate(-30deg)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
  #actionBtns{position:fixed;top:10px;right:14px;display:flex;gap:8px;z-index:10}
  .action-btn{padding:8px 20px;border-radius:8px;font-family:'Bungee',cursive;font-size:14px;border:none;cursor:pointer;transition:all .2s;letter-spacing:1px}
  .action-btn:hover{transform:scale(1.05)}
  .btn-battle{background:linear-gradient(135deg,#e94560,#c2185b);color:#fff;box-shadow:0 4px 16px rgba(233,69,96,.4)}
  .btn-reset{background:linear-gradient(135deg,#334155,#1e293b);color:#94a3b8;border:1px solid #475569}
  #troopBar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(8,12,22,.98),rgba(15,22,41,.92));border-top:2px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:8px;z-index:10}
  .troop-slot{position:relative;width:64px;height:74px;background:linear-gradient(145deg,#162040,#101830);border:2px solid #253560;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
  .troop-slot:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 4px 16px rgba(255,215,0,.15)}
  .troop-slot.selected{border-color:var(--gold);background:linear-gradient(145deg,#1e2a50,#162040);box-shadow:0 0 16px rgba(255,215,0,.2)}
  .troop-slot.hero{border-color:#a855f7}.troop-slot.hero.selected{border-color:#c084fc;box-shadow:0 0 20px rgba(168,85,247,.3)}
  .troop-icon{font-size:24px}.troop-name{font-size:8px;color:#64748b;font-weight:700;text-transform:uppercase;margin-top:1px}
  .troop-count{position:absolute;bottom:3px;right:5px;background:var(--red);color:#fff;font-size:10px;font-weight:900;padding:1px 5px;border-radius:6px}
  .troop-slot.hero .troop-count{background:#7c3aed}
  #instructions{position:fixed;top:58px;left:50%;transform:translateX(-50%);color:#64748b;font-size:12px;z-index:10;background:rgba(8,12,22,.85);padding:5px 14px;border-radius:6px;transition:opacity .4s}
  #loadingOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #loadingOverlay h2{font-family:'Bungee',cursive;font-size:24px;color:var(--gold);margin-bottom:16px}
  #loadingBar{width:300px;height:8px;background:#1e293b;border-radius:4px;overflow:hidden}
  #loadingFill{height:100%;background:linear-gradient(90deg,var(--gold),#ff6b35);width:0%;transition:width .3s}
  #loadingText{color:#64748b;font-size:12px;margin-top:8px}
  #resultOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;flex-direction:column;align-items:center;justify-content:center}
  #resultOverlay.show{display:flex}
  .result-title{font-family:'Bungee',cursive;font-size:48px;text-shadow:0 0 30px rgba(255,215,0,.4);margin-bottom:16px}
  .result-stats{color:#94a3b8;font-size:16px;text-align:center;line-height:2}
  .result-btn{margin-top:24px;padding:12px 36px;border-radius:10px;font-family:'Bungee',cursive;font-size:16px;border:none;cursor:pointer;background:linear-gradient(135deg,#4ade80,#16a34a);color:#fff;box-shadow:0 4px 16px rgba(74,222,128,.3)}
  #soundToggle{position:fixed;bottom:96px;right:14px;z-index:10;width:36px;height:36px;border-radius:50%;background:var(--panel);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
  #assetError{display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#991b1b;color:#fca5a5;padding:8px 16px;border-radius:8px;font-size:12px;z-index:20}
  #editorToggleBtn{position:fixed;left:14px;top:58px;z-index:30;padding:7px 14px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:700;box-shadow:0 4px 12px rgba(124,58,237,.4)}
  /* DEBUG: editör açıkken altın kenarlık */
  body[data-ed] canvas{outline:4px solid #ffd700 !important;}
  body[data-ed] #editorToggleBtn{background:linear-gradient(135deg,#ffd700,#f59e0b)!important;color:#000!important;}
  #editorPanel{position:fixed;left:0;top:0;bottom:0;width:260px;background:rgba(8,12,22,.97);border-right:2px solid #1c2844;z-index:25;display:none;flex-direction:column;overflow:hidden}
  #editorPanel.open{display:flex}
  #editorHeader{padding:10px 12px;border-bottom:1px solid #1c2844;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  #editorHeader h3{color:#ffd700;font-size:13px;margin:0}
  .ep-btn{padding:4px 9px;border-radius:5px;border:none;cursor:pointer;font-size:11px;font-weight:700}
  .ep-copy{background:#10b981;color:#fff}.ep-close{background:#334155;color:#94a3b8}
  #editorSearch{margin:7px 8px 4px;padding:5px 10px;background:#0f1629;border:1px solid #253560;color:#e2e8f0;border-radius:6px;font-size:12px;width:calc(100% - 16px);box-sizing:border-box}
  #editorList{flex:1;overflow-y:auto;padding:4px 6px}
  .ed-item{background:#0f1629;border:1px solid #253560;border-radius:7px;padding:7px 8px;margin-bottom:5px;transition:border-color .15s}
  .ed-item.selected{border-color:#ffd700;background:#1a1f35}
  .ed-name{color:#e2e8f0;font-size:12px;font-weight:600;margin-bottom:2px}
  .ed-path{color:#475569;font-size:9px;margin-bottom:5px;word-break:break-all}
  .ed-controls{display:flex;align-items:center;gap:5px}
  .ed-sbtn{width:22px;height:22px;border-radius:4px;border:none;cursor:pointer;font-size:15px;font-weight:bold;line-height:1}
  .ed-sminus{background:#991b1b;color:#fca5a5}.ed-splus{background:#166534;color:#86efac}
  .ed-sval{color:#ffd700;font-size:12px;font-weight:700;min-width:32px;text-align:center}
  .ed-pbtn{flex:1;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;border:none;border-radius:5px;padding:3px 6px;cursor:pointer;font-size:11px;font-weight:700}
  .ed-pbtn.active{background:linear-gradient(135deg,#ffd700,#f59e0b);color:#000}
  #editorStatus{background:#0f1629;border-top:1px solid #1c2844;padding:7px 10px;font-size:11px;color:#64748b;flex-shrink:0}
  .ed-active{color:#ffd700;font-weight:700}
  #editorEscBtn{display:none;margin:6px 8px;padding:5px;background:#991b1b;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;width:calc(100% - 16px)}
  #edTransformPanel{display:none;padding:8px 10px;border-top:1px solid #1c2844;background:#0a0f1e;flex-shrink:0}
  #edTransformPanel .edt-title{color:#ffd700;font-size:10px;font-weight:700;margin-bottom:6px;text-transform:uppercase}
  #edTransformPanel .edt-row{display:flex;gap:5px;align-items:center;margin-bottom:5px}
  .edt-btn{flex:1;padding:5px 4px;border-radius:5px;border:none;cursor:pointer;font-size:11px;font-weight:700}
  .edt-rot{background:#1e3a5f;color:#60a5fa}
  .edt-del{background:#7f1d1d;color:#fca5a5}
  .edt-move-hint{color:#475569;font-size:9px;text-align:center}
</style>
</head>

<div id="soundToggle" onclick="toggleSound()">🔊</div>

<button id="editorToggleBtn" onclick="toggleEditorPanel()">🏗️ Editör</button>

<!-- Three.js r128 - import map ile bare specifier sorunu çözülüyor -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

// ================================================================
//  URL PARAMS — ordu sayıları oyuncunun gerçek verisinden gelir
// ================================================================
const _p = new URLSearchParams(window.location.search);
const _infantry = Math.min(200, Math.max(1, parseInt(_p.get('infantry')) || 20));
const _archer   = Math.min(200, Math.max(0, parseInt(_p.get('archer'))   || 15));
const _cavalry  = Math.min(100, Math.max(0, parseInt(_p.get('cavalry'))  || 8));
const _healer   = Math.min(20,  Math.max(0, parseInt(_p.get('healer'))   || 3));

// ================================================================
//  CONFIG
// ================================================================
const GRID = 22, CELL = 2;
const ASSET_BASE = './assets/';

const CHAR_MODELS = {
  infantry: 'characters/Knight.glb',
  archer:   'characters/Ranger.glb',
  cavalry:  'characters/Barbarian.glb',
  healer:   'characters/Mage.glb',
  hero:     'characters/Rogue_Hooded.glb',
};

const BLDG_MODELS = {
  townhall:       'buildings/blue/building_castle_blue.gltf',
  cannon:         'buildings/blue/building_tower_catapult_blue.gltf',
  archer_tower:   'buildings/blue/building_tower_A_blue.gltf',
  mortar:         'buildings/blue/building_tower_B_blue.gltf',
  gold_storage:   'buildings/blue/building_mine_blue.gltf',
  elixir_storage: 'buildings/blue/building_church_blue.gltf',
  barracks:       'buildings/blue/building_barracks_blue.gltf',
  wall:           'buildings/neutral/wall_straight.gltf',
  wall_corner:    'buildings/neutral/wall_corner_A_outside.gltf',
};

const DESTROYED_MODEL = 'buildings/neutral/building_destroyed.gltf';

// Rig_Medium animasyon klipleri (preloadAssets'te doldurulur)
let rigAnims = [];

// Karakter → handslot kemiğine bağlanacak silahlar (GLTF)
// Three.js kemik isimlerinden dot'ları kaldırır: handslot.r → handslotr
const WEAPON_CONFIG = {
  infantry: [
    {gltf:'weapons/sword_1handed.gltf', bone:'handslotr', rot:{x:0,y:0,z:0}},
    {gltf:'weapons/shield_badge.gltf',  bone:'handslotl', rot:{x:0,y:Math.PI,z:0}},
  ],
  archer:  [{gltf:'weapons/bow_withString.gltf', bone:'handslotl', rot:{x:0,y:0,z:0}}],
  cavalry: [{gltf:'weapons/axe_2handed.gltf',    bone:'handslotr', rot:{x:0,y:0,z:0}}],
  healer:  [{gltf:'weapons/staff.gltf',           bone:'handslotr', rot:{x:0,y:0,z:0}}],
  hero:    [{gltf:'weapons/dagger.gltf',           bone:'handslotr', rot:{x:0,y:0,z:0}}],
};

// Skeleton içinde isimle kemik bul — traverse + skeleton.bones
function findBone(root, name){
  let found=null;
  root.traverse(c=>{
    if(c.name===name){found=c;return;}
    if(c.isSkinnedMesh&&c.skeleton){
      const b=c.skeleton.bones.find(b=>b.name===name);
      if(b)found=b;
    }
  });
  if(!found){
    // İlk SkinnedMesh'in kemik isimlerini logla (sadece ilk karakter için)
    if(!window._boneDebugDone){
      window._boneDebugDone=true;
      root.traverse(c=>{
        if(c.isSkinnedMesh&&c.skeleton){
          console.log('[BONES]',c.name,'→',c.skeleton.bones.map(b=>b.name).join(' | '));
        }
      });
    }
  }
  return found;
}

// Silahı handslot kemiğine GLTF olarak bağla
function attachWeapon(model, wc){
  const bone=findBone(model, wc.bone);
  if(!bone){console.warn('Kemik bulunamadı:',wc.bone);return;}
  gltfLoader.load(ASSET_BASE+wc.gltf, gltf=>{
    const weapon=gltf.scene;
    weapon.traverse(c=>{if(c.isMesh){c.castShadow=true;}});
    weapon.rotation.set(wc.rot.x,wc.rot.y,wc.rot.z);
    bone.add(weapon);
  }, undefined, err=>console.warn('Silah yüklenemedi:',wc.gltf,err));
}

// ================================================================
//  GAME STATE
// ================================================================
let scene, camera, renderer, clock, gltfLoader;
let groundMesh;
const troopMeshes = new Map();
const buildingMeshes = new Map();
const modelCache = new Map();

let mode='battle', gameState='setup', selectedTroop='infantry';
let troops=[], buildings=[], projectiles=[];
let battleTimer=180, stars=0, destructionPct=0, townHallDead=false, animT=0;

// Ordu sayıları URL'den okunuyor
let troopCounts = {infantry:_infantry, archer:_archer, cavalry:_cavalry, healer:_healer, hero:1};
const INIT_COUNTS = {infantry:_infantry, archer:_archer, cavalry:_cavalry, healer:_healer, hero:1};

// Troop bar sayılarını güncelle
document.getElementById('cnt-infantry').textContent = _infantry;
document.getElementById('cnt-archer').textContent   = _archer;
document.getElementById('cnt-cavalry').textContent  = _cavalry;
document.getElementById('cnt-healer').textContent   = _healer;

const TROOP_DEF={
  infantry:{name:'Piyade',hp:100,dmg:20,spd:1.6,range:1.5,atkSpd:.9,color:'#3B82F6',size:9,priority:'nearest',armor:.1,modelScale:.7},
  archer:{name:'Okçu',hp:50,dmg:16,spd:1.4,range:6,atkSpd:1,color:'#10B981',size:7,priority:'nearest',modelScale:.7},
  cavalry:{name:'Süvari',hp:180,dmg:35,spd:2.8,range:1.8,atkSpd:1.3,color:'#8B5CF6',size:13,priority:'defense',charge:true,chargeDmgMult:2,modelScale:.9},
  healer:{name:'Şifacı',hp:60,dmg:0,spd:1,range:5,atkSpd:1.5,color:'#4ade80',size:7,priority:'heal',healAmt:22,modelScale:.7},
  hero:{name:'Kral',hp:650,dmg:55,spd:1.5,range:1.5,atkSpd:1.1,color:'#EAB308',size:16,priority:'nearest',armor:.15,modelScale:.9,
    ability:{cooldown:14,duration:5,dmgBoost:1.5,speedBoost:1.3,radius:4}},
};

const BLDG_DEF={
  townhall:{name:'Belediye',hp:1500,w:2,h:2,isDef:false,val:30,modelScale:2.5},
  cannon:{name:'Top',hp:400,w:1,h:1,isDef:true,dmg:22,range:6,atkSpd:1,modelScale:1.8},
  archer_tower:{name:'Okçu Kulesi',hp:350,w:1,h:1,isDef:true,dmg:15,range:8,atkSpd:.8,modelScale:1.8},
  mortar:{name:'Havan',hp:300,w:1,h:1,isDef:true,dmg:35,range:7,atkSpd:3,splash:2,minRange:3,modelScale:1.6},
  gold_storage:{name:'Altın Deposu',hp:500,w:1,h:1,isDef:false,val:10,modelScale:1.5},
  elixir_storage:{name:'İksir Deposu',hp:500,w:1,h:1,isDef:false,val:10,modelScale:1.5},
  wall:{name:'Duvar',hp:250,w:.5,h:.5,isDef:false,isWall:true,val:0,modelScale:1.0},
  wall_corner:{name:'Köşe Duvar',hp:250,w:.5,h:.5,isDef:false,isWall:true,val:0,modelScale:1.0},
  barracks:{name:'Kışla',hp:350,w:1,h:1,isDef:false,val:5,modelScale:1.5},
};

const gDist=(a,b)=>Math.sqrt((a.gx-b.gx)**2+(a.gy-b.gy)**2);
const g2w=(gx,gy)=>({x:(gx-GRID/2)*CELL, y:0, z:(gy-GRID/2)*CELL});
const w2g=(x,z)=>({gx:x/CELL+GRID/2, gy:z/CELL+GRID/2});

// ================================================================
//  LOADING
// ================================================================
function setLoading(pct,txt){
  document.getElementById('loadingFill').style.width=pct+'%';
  document.getElementById('loadingText').textContent=txt;
}

function showAssetError(msg){
  const el=document.getElementById('assetError');
  el.style.display='block'; el.textContent='⚠️ '+msg;
  setTimeout(()=>el.style.display='none',5000);
}

// Inline SkeletonUtils.clone — CDN'deki export format sorununu bypass eder
function cloneSkinnedMesh(source){
  const cloned=source.clone();
  const srcLookup=new Map(), clnLookup=new Map();
  function parallelTraverse(a,b,cb){cb(a,b);for(let i=0;i<a.children.length;i++)parallelTraverse(a.children[i],b.children[i],cb);}
  parallelTraverse(source,cloned,(s,c)=>{srcLookup.set(c,s);clnLookup.set(s,c);});
  cloned.traverse(node=>{
    if(!node.isSkinnedMesh)return;
    const src=srcLookup.get(node);
    node.skeleton=src.skeleton.clone();
    node.bindMatrix.copy(src.bindMatrix);
    node.skeleton.bones=src.skeleton.bones.map(b=>clnLookup.get(b)||b);
    node.bind(node.skeleton,node.bindMatrix);
  });
  return cloned;
}
function cloneModel(model){
  let hasSkin=false;
  model.traverse(c=>{if(c.isSkinnedMesh)hasSkin=true;});
  return hasSkin ? cloneSkinnedMesh(model) : model.clone();
}

// Animasyon clip'ini isim listesine göre bul (kısmi eşleşme)
function findClip(animations, names){
  for(const name of names){
    const c=animations.find(a=>a.name===name||a.name.toLowerCase().includes(name.toLowerCase()));
    if(c) return c;
  }
  return animations.length ? animations[0] : null;
}

// {scene, animations} döndürür — animasyonları da cache'ler
async function loadModelData(path){
  if(modelCache.has(path)){
    const cached=modelCache.get(path);
    return {scene:cloneModel(cached.scene), animations:cached.animations};
  }
  return new Promise((resolve,reject)=>{
    gltfLoader.load(ASSET_BASE+path,
      gltf=>{
        const model=gltf.scene;
        model.traverse(child=>{if(child.isMesh||child.isSkinnedMesh){child.castShadow=true;child.receiveShadow=true;}});
        const anims=gltf.animations||[];
        // Karakter modellerinin içindeki mesh isimlerini logla
        if(path.includes('characters')){
          const meshNames=[];
          model.traverse(c=>{if(c.isMesh||c.isSkinnedMesh)meshNames.push(c.name||'(unnamed)');});
          console.log(`[MESH] ${path}:`, meshNames);
        }
        const data={scene:model, animations:anims};
        modelCache.set(path,data);
        resolve({scene:cloneModel(model), animations:anims});
      },
      undefined,
      err=>{console.warn(`Model yüklenemedi: ${path}`,err);reject(err);}
    );
  });
}

function createFallbackBuilding(type){
  const g=new THREE.Group();
  const d=BLDG_DEF[type];
  const s=d.modelScale||1;
  const mat=new THREE.MeshStandardMaterial({color:type==='wall'?0x8D6E63:0x607D8B,roughness:.7});
  const box=new THREE.Mesh(new THREE.BoxGeometry(CELL*s*.8,CELL*s,CELL*s*.8),mat);
  box.position.y=CELL*s*.5; box.castShadow=true;
  g.add(box);
  return g;
}

function createFallbackTroop(type){
  const g=new THREE.Group();
  const d=TROOP_DEF[type];
  const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(d.color)});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.2,.25,.6,8),mat);
  body.position.y=.3; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.15,8,6),new THREE.MeshStandardMaterial({color:0xFFCC80}));
  head.position.y=.75; g.add(head);
  return g;
}

  camera.position.set(30,30,30);

  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});

  renderer.shadowMap.enabled=true;

  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;

  sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;
  scene.add(sun);
  scene.add(new THREE.DirectionalLight(0x4488ff,.25).translateX(-15).translateY(10));

  // Procedural grass texture
  const gtCanvas=document.createElement('canvas');
  gtCanvas.width=512;gtCanvas.height=512;
  const gtCtx=gtCanvas.getContext('2d');
  // Base grass
  gtCtx.fillStyle='#4a8e28';gtCtx.fillRect(0,0,512,512);
  // Varied patches
  const patchColors=['#5aaa30','#3a7818','#62b838','#4d9225','#326b12'];
  for(let i=0;i<300;i++){
    gtCtx.fillStyle=patchColors[Math.floor(Math.random()*patchColors.length)];
    const px=Math.random()*512,py=Math.random()*512;
    const pr=8+Math.random()*32;
    gtCtx.beginPath();gtCtx.ellipse(px,py,pr,pr*.6,Math.random()*Math.PI,0,Math.PI*2);gtCtx.fill();
  }
  // Dirt path tiles (subtle grid hints)
  gtCtx.strokeStyle='rgba(101,67,33,0.15)';gtCtx.lineWidth=1;
  for(let g=0;g<=512;g+=32){gtCtx.beginPath();gtCtx.moveTo(g,0);gtCtx.lineTo(g,512);gtCtx.stroke();gtCtx.beginPath();gtCtx.moveTo(0,g);gtCtx.lineTo(512,g);gtCtx.stroke();}
  // Small stones/pebbles
  for(let i=0;i<80;i++){
    gtCtx.fillStyle=`rgba(${80+Math.random()*40},${80+Math.random()*40},${60+Math.random()*30},0.4)`;
    const sx=Math.random()*512,sy=Math.random()*512;
    gtCtx.beginPath();gtCtx.ellipse(sx,sy,2+Math.random()*3,1+Math.random()*2,Math.random()*Math.PI,0,Math.PI*2);gtCtx.fill();
  }
  const gtTex=new THREE.CanvasTexture(gtCanvas);
  gtTex.wrapS=gtTex.wrapT=THREE.RepeatWrapping;gtTex.repeat.set(6,6);
  const gMat=new THREE.MeshStandardMaterial({map:gtTex,roughness:.95,metalness:0});
  groundMesh=new THREE.Mesh(new THREE.PlaneGeometry(GRID*CELL+40,GRID*CELL+40),gMat);
  groundMesh.rotation.x=-Math.PI/2;groundMesh.receiveShadow=true;
  scene.add(groundMesh);

  // Subtle dirt path overlay inside base area
  const pathCanvas=document.createElement('canvas');
  pathCanvas.width=256;pathCanvas.height=256;
  const pCtx=pathCanvas.getContext('2d');
  pCtx.fillStyle='rgba(0,0,0,0)';pCtx.fillRect(0,0,256,256);
  pCtx.strokeStyle='rgba(139,90,43,0.18)';pCtx.lineWidth=6;
  for(let g=0;g<=256;g+=32){pCtx.beginPath();pCtx.moveTo(g,0);pCtx.lineTo(g,256);pCtx.stroke();pCtx.beginPath();pCtx.moveTo(0,g);pCtx.lineTo(256,g);pCtx.stroke();}
  const pathTex=new THREE.CanvasTexture(pathCanvas);
  pathTex.wrapS=pathTex.wrapT=THREE.RepeatWrapping;pathTex.repeat.set(GRID/4,GRID/4);
  const overlayMat=new THREE.MeshBasicMaterial({map:pathTex,transparent:true,opacity:1,depthWrite:false});
  const overlayM=new THREE.Mesh(new THREE.PlaneGeometry(GRID*CELL,GRID*CELL),overlayMat);
  overlayM.rotation.x=-Math.PI/2;overlayM.position.y=.02;scene.add(overlayM);
}

async function createTroopMesh(t){
  const d=TROOP_DEF[t.type];
  let model;

  try{
    const {scene:ts}=await loadModelData(CHAR_MODELS[t.type]);
    model=ts;
  }catch(e){
    model=createFallbackTroop(t.type);

    const idle=findClip(rigAnims,['Idle_A','Idle_B','Idle']);
    if(idle){const a=mixer.clipAction(idle);a.play();t.currentAnim='idle';t.currentAction=a;}
  }

  // Silahları handslot kemiklerine GLTF olarak bağla
  const weapConf=WEAPON_CONFIG[t.type];

function updateHpBar(sprite,pct){
  if(!sprite||!sprite.userData.canvas)return;
  const c=sprite.userData.canvas;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,64,8);
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,64,8);
  ctx.fillStyle=pct>.5?'#4caf50':pct>.25?'#ff9800':'#f44336';
  ctx.fillRect(1,1,62*pct,6);
  sprite.userData.tex.needsUpdate=true;
}

// ================================================================
//  BATTLE LOGIC
// ================================================================
function findTarget(tr){
  const d=TROOP_DEF[tr.type];const alive=buildings.filter(b=>b.hp>0);
  if(!alive.length)return null;
  if(d.priority==='heal'){let best=null,bestHp=1;troops.forEach(t=>{if(t!==tr&&t.state!=='dead'&&t.type!=='healer'){const r=t.hp/t.maxHp;if(r<bestHp){bestHp=r;best=t;}}});return best;}
  if(d.priority==='defense'){const defs=alive.filter(b=>BLDG_DEF[b.type].isDef);const pool=defs.length?defs:alive;let best=null,bestD=Infinity;pool.forEach(b=>{const dd=gDist(tr,b);if(dd<bestD){bestD=dd;best=b;}});return best;}
  let best=null,bestD=Infinity;alive.forEach(b=>{const dd=gDist(tr,b);if(dd<bestD){bestD=dd;best=b;}});return best;
}

function updateTroops(dt){
  troops.forEach(tr=>{
    if(tr.state==='dead'){tr.deadTimer+=dt;return;}
    const d=TROOP_DEF[tr.type];tr.anim+=dt*5;
    if(tr.abilityActive>0){tr.abilityActive-=dt;if(tr.abilityActive<=0){tr.dmgMult=1;tr.spdMult=1;}}
    if(tr.abilityCd>0)tr.abilityCd-=dt;
    if(tr._boosted>0){tr._boosted-=dt;if(tr._boosted<=0){tr.dmgMult=1;tr.spdMult=1;}}
    if(tr.type==='hero'&&tr.hp<tr.maxHp*.5&&tr.abilityCd<=0)activateAbility(tr);
    if(!tr.target||(tr.target.hp!==undefined&&tr.target.hp<=0)||(tr.target.state&&tr.target.state==='dead')){tr.target=findTarget(tr);if(!tr.target){tr.state='idle';return;}}
    const dist=gDist(tr,tr.target);
    if(d.priority==='heal'){
      if(tr.target.state==='dead'||tr.target.hp>=tr.target.maxHp){tr.target=null;return;}
      if(dist<=d.range){tr.state='attacking';tr.atkTimer+=dt;if(tr.atkTimer>=d.atkSpd){tr.atkTimer=0;tr.target.hp=Math.min(tr.target.maxHp,tr.target.hp+d.healAmt);SFX.play('place');}}else moveToward(tr,d,dt);return;
    }
    if(dist<=d.range){
      tr.state='attacking';tr.atkTimer+=dt;
      if(tr.atkTimer>=d.atkSpd){tr.atkTimer=0;let dmg=Math.round(d.dmg*tr.dmgMult);
        if(d.charge&&!tr._charged){dmg=Math.round(dmg*d.chargeDmgMult);tr._charged=true;SFX.play('star');}
        if(d.range>2){projectiles.push({from:{gx:tr.gx,gy:tr.gy},target:tr.target,dmg,t:0,splash:d.splash||0});SFX.play('shoot');}
        else{dealDamage(tr.target,dmg);SFX.play('hit');}
      }
    }else moveToward(tr,d,dt);
  });
  troops.forEach(t=>{if(t.state==='dead'&&t.deadTimer>2){const m=troopMeshes.get(t);if(m){scene.remove(m);troopMeshes.delete(t);}}});
  troops=troops.filter(t=>t.state!=='dead'||t.deadTimer<2);
}

function moveToward(tr,d,dt){
  tr.state='moving';tr.atkTimer=0;if(!tr.target)return;
  const dx=tr.target.gx-tr.gx,dy=tr.target.gy-tr.gy,dd=Math.sqrt(dx*dx+dy*dy);
  if(dd>.1){const mv=d.spd*(tr.spdMult||1)*dt;tr.gx+=(dx/dd)*Math.min(mv,dd);tr.gy+=(dy/dd)*Math.min(mv,dd);}
  buildings.forEach(b=>{if(b.hp<=0||b.type!=='wall')return;if(gDist(tr,b)<.8)tr.target=b;});
}

function activateAbility(hero){
  if(hero.abilityCd>0||hero.abilityActive>0)return;
  const ab=TROOP_DEF.hero.ability;hero.abilityActive=ab.duration;hero.abilityCd=ab.cooldown;hero.dmgMult=ab.dmgBoost;hero.spdMult=ab.speedBoost;
  troops.forEach(t=>{if(t.state!=='dead'&&t!==hero&&gDist(t,hero)<ab.radius){t.dmgMult=ab.dmgBoost;t.spdMult=ab.speedBoost;t._boosted=ab.duration;}});
  SFX.play('star');
}

function dealDamage(b,dmg){b.hp-=dmg;if(b.hp<=0){b.hp=0;onDestroyed(b);}}

async function onDestroyed(b){
  const mesh=buildingMeshes.get(b);
  if(mesh){mesh.userData.destroying=true;mesh.userData.destroyTimer=0;}
  updateDestruction();
  if(b.type==='townhall'){townHallDead=true;checkStars();}
  SFX.play('destroy');
}

function updateDestruction(){
  const total=buildings.filter(b=>!BLDG_DEF[b.type].isWall).length;
  const dead=buildings.filter(b=>!BLDG_DEF[b.type].isWall&&b.hp<=0).length;
  destructionPct=total?Math.round(dead/total*100):0;
  document.getElementById('percentText').textContent=destructionPct+'%';checkStars();
}

function checkStars(){
  let s=0;if(destructionPct>=50)s=1;if(townHallDead&&s>=1)s=2;if(destructionPct>=100)s=3;
  if(s>stars){stars=s;for(let i=1;i<=3;i++){const el=document.getElementById(`star${i}`);if(i<=stars){el.querySelector('polygon').setAttribute('fill','#ffd700');el.classList.add('earned');SFX.play('star');}}}
}

function updateDefenses(dt){
  buildings.forEach(b=>{
    if(b.hp<=0)return;const d=BLDG_DEF[b.type];if(!d.isDef)return;
    if(!b.atkTimer)b.atkTimer=0;b.atkTimer+=dt;
    if(b.atkTimer>=d.atkSpd){
      let near=null,best=Infinity;
      troops.forEach(t=>{if(t.state==='dead')return;const dd=gDist(t,b);if(d.minRange&&dd<d.minRange)return;if(dd<d.range&&dd<best){best=dd;near=t;}});
      if(near){b.atkTimer=0;projectiles.push({from:{gx:b.gx,gy:b.gy},troopTarget:near,dmg:d.dmg,t:0,isDef:true,splash:d.splash||0});SFX.play('shoot');}
    }
  });
}

function updateProjectiles(dt){
  projectiles.forEach(p=>{
    p.t+=dt*3;
    if(p.t>=1){
      p.dead=true;
      if(p.isDef&&p.troopTarget&&p.troopTarget.state!=='dead'){
        const armor=TROOP_DEF[p.troopTarget.type].armor||0;
        p.troopTarget.hp-=Math.round(p.dmg*(1-armor));
        if(p.troopTarget.hp<=0){p.troopTarget.state='dead';p.troopTarget.deadTimer=0;}
        SFX.play('hit');
      }else if(!p.isDef&&p.target&&p.target.hp>0){dealDamage(p.target,p.dmg);SFX.play('hit');}
      if(p.mesh){scene.remove(p.mesh);p.mesh=null;}
    }else{
      if(!p.mesh){
        // Ok: silindir (daha görünür), top: küre
        const geo=p.isDef
          ? new THREE.SphereGeometry(.22,8,8)
          : new THREE.CylinderGeometry(.04,.04,.6,6);
        const mat=new THREE.MeshBasicMaterial({color:p.isDef?0xff4444:0xd4a04a});
        p.mesh=new THREE.Mesh(geo,mat);scene.add(p.mesh);
      }
      const target=p.troopTarget||p.target;
      const fp=g2w(p.from.gx,p.from.gy),tp=g2w(target.gx,target.gy);
      const arc=Math.sin(p.t*Math.PI)*3;
      const px=fp.x+(tp.x-fp.x)*p.t, pz=fp.z+(tp.z-fp.z)*p.t;
      p.mesh.position.set(px, .5+arc, pz);
      // Ok'u hareket yönüne döndür
      if(!p.isDef){
        const dx=tp.x-fp.x, dz=tp.z-fp.z;
        p.mesh.rotation.z=Math.PI/2;
        p.mesh.rotation.y=Math.atan2(dx,dz);
      }
    }
  });
  projectiles=projectiles.filter(p=>!p.dead);
}

// ================================================================
//  3D MESH SYNC
// ================================================================
function updateMeshes(dt){
  troops.forEach(t=>{
    const mesh=troopMeshes.get(t);if(!mesh)return;
    const pos=g2w(t.gx,t.gy);
    const d=TROOP_DEF[t.type];const ms=d.modelScale||.7;

    // Pozisyon
    mesh.position.set(pos.x,0,pos.z);

    // Hedefe dön
    if(t.target){
      const tp=g2w(t.target.gx,t.target.gy);
      const ang=Math.atan2(tp.x-pos.x,tp.z-pos.z);
      mesh.rotation.y+=(ang-mesh.rotation.y)*.15;
    }

    // HP bar
    const hpBar=mesh.getObjectByName('hpBar');
    if(hpBar){
      if(t.hp<t.maxHp){hpBar.visible=true;updateHpBar(hpBar,t.hp/t.maxHp);}
      else hpBar.visible=false;
    }

    // Scale (ability boost)
    const boost=t.abilityActive>0||t._boosted>0;
    const sc=boost?1+Math.sin(animT*6)*.06:1;
    mesh.scale.set(ms*sc,ms*sc,ms*sc);

    // Animasyon durumu geçişi
    if(t.mixer&&rigAnims.length){
      const targetAnim=t.state==='moving'?'walk':t.state==='attacking'?'attack':t.state==='dead'?'death':'idle';
      if(t.currentAnim!==targetAnim){
        // Menzilli birimler Use_Item, yakın dövüş Throw kullanır
        const isRanged=TROOP_DEF[t.type].range>2;
        const names=targetAnim==='walk'?['Walking_A','Walking_B','Running_A']:
                    targetAnim==='attack'?(isRanged?['Use_Item','Interact','Throw']:['Throw','Use_Item','Interact']):
                    targetAnim==='death'?['Death_A','Death_B']:
                    ['Idle_A','Idle_B'];
        const clip=findClip(rigAnims,names);
        if(clip){
          const newAct=t.mixer.clipAction(clip);
          if(t.currentAction&&t.currentAction!==newAct)t.currentAction.fadeOut(.2);
          newAct.reset().fadeIn(.2).play();
          if(targetAnim==='death'){newAct.setLoop(THREE.LoopOnce,1);newAct.clampWhenFinished=true;}
          t.currentAction=newAct;
        }
        t.currentAnim=targetAnim;
      }
    }
  });

  buildings.forEach(b=>{
    const mesh=buildingMeshes.get(b);if(!mesh)return;
    if(mesh.userData.destroying){
      mesh.userData.destroyTimer+=dt;
      const t=mesh.userData.destroyTimer;
      const s=Math.max(.01,1-t*.6);
      mesh.scale.set(s,Math.max(.01,1-t),s);
      mesh.position.y=-t*.5;
      if(t>1.5){scene.remove(mesh);buildingMeshes.delete(b);}
      return;
    }
    const ring=mesh.getObjectByName('rangeRing');
    if(ring)ring.visible=(gameState==='setup');
    if(BLDG_DEF[b.type].isDef){
      const near=troops.find(t=>t.state!=='dead'&&gDist(t,b)<(BLDG_DEF[b.type].range||6));
      if(near){
        const tp=g2w(near.gx,near.gy),bp=g2w(b.gx,b.gy);
        const ang=Math.atan2(tp.x-bp.x,tp.z-bp.z);
        mesh.rotation.y+=(ang-mesh.rotation.y)*.03;
      }
    }
  });
}

const SFX={
  ctx:null,enabled:true,mg:null,
  init(){if(this.ctx)return;this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.mg=this.ctx.createGain();this.mg.gain.value=.25;this.mg.connect(this.ctx.destination);},
  play(type){
    if(!this.enabled||!this.ctx)return;
    try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.mg);const t=this.ctx.currentTime;
    if(type==='shoot'){o.type='sawtooth';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(80,t+.1);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.12);}
    else if(type==='hit'){o.type='square';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.08);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.start(t);o.stop(t+.1);}
    else if(type==='destroy'){o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(30,t+.3);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.35);}
    else if(type==='place'){o.type='sine';o.frequency.setValueAtTime(600,t);o.frequency.exponentialRampToValueAtTime(900,t+.06);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start(t);o.stop(t+.08);}
    else if(type==='star'){o.type='sine';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(784,t+.2);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4);}
    }catch(e){}
  }
};
window.toggleSound=()=>{SFX.enabled=!SFX.enabled;document.getElementById('soundToggle').textContent=SFX.enabled?'🔊':'🔇';};

async function spawnTroop(type,gx,gy){
  if(troopCounts[type]<=0)return;
  if(gx<-1||gx>GRID+1||gy<-1||gy>GRID+1)return;
  if(gDist({gx,gy},{gx:GRID/2,gy:GRID/2})<4.5&&gameState==='setup')return;
  const d=TROOP_DEF[type];
  const t={type,gx,gy,hp:d.hp,maxHp:d.hp,target:null,state:'idle',atkTimer:0,anim:Math.random()*6.28,deadTimer:0,abilityCd:0,abilityActive:0,dmgMult:1,spdMult:1,_charged:false};
  troops.push(t);
  troopCounts[type]--;
  document.getElementById(`cnt-${type}`).textContent=troopCounts[type];
  await createTroopMesh(t);
  SFX.play('place');
}

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
// Editör açık mı? — body attribute ile en güvenilir kontrol
function edActive(){return document.body.hasAttribute('data-ed');}

let _mdPos=null,_mdDrag=false;

function _getRay(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
}

function onClick(e){
  SFX.init();
  if(edActive()){
    if(_mdDrag){_mdDrag=false;return;} // sürükleme bitti, click sayma
    _getRay(e);
    if(editorMode&&editorSelected){
      // Yerleştirme modu
      const gh=raycaster.intersectObject(groundMesh);
      if(gh.length){const g=w2g(gh[0].point.x,gh[0].point.z);placeEditorModel(g.gx,g.gy);}
      return;
    }
    // Seçim modu — editorMeshes içinde raycast
    const hit=_edHit(e);
    if(hit)selectEditorObject(hit);
    else selectEditorObject(null);
    return; // Editör açıkken ASLA asker yerleştirme
  }
  // Normal oyun modu
  _getRay(e);
  const hits=raycaster.intersectObject(groundMesh);
  if(hits.length){
    const g=w2g(hits[0].point.x,hits[0].point.z);
    if(gameState==='setup'||gameState==='battle')spawnTroop(selectedTroop,g.gx,g.gy);
  }
}

function _groundPt(e){_getRay(e);const h=raycaster.intersectObject(groundMesh);return h.length?h[0].point:null;}
function _edHit(e){
  _getRay(e);
  const flat=[];
  // Editor'da yerleştirilen objeler
  editorMeshes.forEach(o=>o.mesh.traverse(c=>{if(c.isMesh||c.isSkinnedMesh)flat.push({mesh:c,obj:o});}));
  // Mevcut base binalar ve duvarlar
  buildingMeshes.forEach((mesh,b)=>{
    if(mesh.userData.destroying)return;
    mesh.traverse(c=>{if(c.isMesh||c.isSkinnedMesh)flat.push({mesh:c,obj:{mesh,key:b.type,isBase:true,buildingRef:b}});});
  });
  if(!flat.length)return null;
  const hits=raycaster.intersectObjects(flat.map(f=>f.mesh),false);
  if(!hits.length)return null;
  const found=flat.find(f=>f.mesh===hits[0].object);
  return found?found.obj:null;
}
function selectEditorObject(obj){
  editorSelectedObj=obj;
  if(selectionRing){scene.remove(selectionRing);selectionRing=null;}
  if(obj){
    const rg=new THREE.RingGeometry(.4,1.3,32);
    const rm=new THREE.MeshBasicMaterial({color:0xffd700,transparent:true,opacity:.75,side:THREE.DoubleSide});
    selectionRing=new THREE.Mesh(rg,rm);
    selectionRing.rotation.x=-Math.PI/2;
    selectionRing.position.copy(obj.mesh.position);
    selectionRing.position.y=.04;
    scene.add(selectionRing);
    document.getElementById('edTransformPanel').style.display='block';
    const displayName=ALL_MODELS[obj.key]?.name||BLDG_DEF[obj.key]?.name||obj.key;
    document.getElementById('editorStatus').innerHTML=`<span class="ed-active">✦ ${displayName}</span> seçili`;
  }else{
    document.getElementById('edTransformPanel').style.display='none';
    if(!editorMode)document.getElementById('editorStatus').textContent='Bir model seç → Yerleştir\'e tıkla → Haritaya tıkla';
  }
}

function _edMouseDown(e){
  if(!edActive()||editorMode)return;
  _mdPos={x:e.clientX,y:e.clientY};_mdDrag=false;
  const hit=_edHit(e);
  if(hit){selectEditorObject(hit);editorDragging=true;editorDragObj=hit;}
}
function _edMouseMove(e){
  if(!editorDragging||!editorDragObj)return;
  const dx=e.clientX-_mdPos.x,dy=e.clientY-_mdPos.y;
  if(!_mdDrag&&dx*dx+dy*dy<16)return;
  _mdDrag=true;
  const pt=_groundPt(e);
  if(pt){editorDragObj.mesh.position.set(pt.x,0,pt.z);if(selectionRing)selectionRing.position.set(pt.x,.04,pt.z);}
}

function gameLoop(){
  requestAnimationFrame(gameLoop);
  const dt=Math.min(clock.getDelta(),.05);animT+=dt;
  if(gameState==='battle'){
    battleTimer-=dt;
    const m=Math.floor(Math.max(0,battleTimer)/60),s=Math.floor(Math.max(0,battleTimer)%60);
    document.getElementById('timerText').textContent=`${m}:${s.toString().padStart(2,'0')}`;
    updateTroops(dt);updateDefenses(dt);updateProjectiles(dt);
    troops.forEach(t=>{if(t.mixer)t.mixer.update(dt);});
    const allDead=troops.length>0&&troops.every(t=>t.state==='dead');
    const noMore=Object.values(troopCounts).every(c=>c===0);
    if(battleTimer<=0||destructionPct>=100||(allDead&&noMore))endBattle();
  }
  updateMeshes(dt);
  renderer.render(scene,camera);
}

  });

  window.addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();const h=troops.find(t=>t.type==='hero'&&t.state!=='dead');if(h)activateAbility(h);}
    if(e.code==='Escape'){
      if(editorMode)cancelEditorPlace();
      else selectEditorObject(null);
    }
    if(e.code==='Delete')deleteSelected();
  });

  setLoading(100,'Hazır!');
  setTimeout(()=>document.getElementById('loadingOverlay').style.display='none',500);
  gameLoop();
}

init();
</script>
</body>
</html>
